name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Source coverage
        run: npm run coverage

      - name: Upload to coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ./coverage/lcov.info

      - name: Build
        run: npm run build

      - name: Pack npm packages
        run: |
          mkdir -p package-artifact
          npm pack --workspace=@jscrypto/core --pack-destination package-artifact
          npm pack --workspace=@jscrypto/ciphers --pack-destination package-artifact
          npm pack --workspace=@jscrypto/modes --pack-destination package-artifact
          npm pack --workspace=@jscrypto/paddings --pack-destination package-artifact
          npm pack --workspace=@jscrypto/kdfs --pack-destination package-artifact
          npm pack --workspace=@jscrypto/formats --pack-destination package-artifact
          npm pack --workspace=@jscrypto/hashes --pack-destination package-artifact
          npm pack --workspace=@jscrypto/suite --pack-destination package-artifact

      - name: Upload packed packages
        uses: actions/upload-artifact@v4
        with:
          name: package-node-24
          path: package-artifact/*.tgz

  runtime-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Download Node 24 packages
        uses: actions/download-artifact@v4
        with:
          name: package-node-24
          path: package-artifact

      - name: Extract package dist
        run: |
          rm -rf packages/core/dist packages/ciphers/dist packages/modes/dist packages/paddings/dist packages/kdfs/dist packages/formats/dist packages/hashes/dist packages/suite/dist
          tar -xzf package-artifact/jscrypto-core-*.tgz --strip-components=1 -C packages/core package/package.json package/dist
          tar -xzf package-artifact/jscrypto-ciphers-*.tgz --strip-components=1 -C packages/ciphers package/package.json package/dist
          tar -xzf package-artifact/jscrypto-modes-*.tgz --strip-components=1 -C packages/modes package/package.json package/dist
          tar -xzf package-artifact/jscrypto-paddings-*.tgz --strip-components=1 -C packages/paddings package/package.json package/dist
          tar -xzf package-artifact/jscrypto-kdfs-*.tgz --strip-components=1 -C packages/kdfs package/package.json package/dist
          tar -xzf package-artifact/jscrypto-formats-*.tgz --strip-components=1 -C packages/formats package/package.json package/dist
          tar -xzf package-artifact/jscrypto-hashes-*.tgz --strip-components=1 -C packages/hashes package/package.json package/dist
          tar -xzf package-artifact/jscrypto-suite-*.tgz --strip-components=1 -C packages/suite package/package.json package/dist

      - name: Run source tests
        run: npm run test:src

      - name: Run tests against package dist
        run: npm run test:dist
