name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Verify release version
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          for PACKAGE in ciphers modes paddings kdfs formats hashes suite; do
            PACKAGE_VERSION=$(node -p "require('./packages/$PACKAGE/package.json').version")
            test "$CORE_VERSION" = "$PACKAGE_VERSION"
          done
          test "$GITHUB_REF_NAME" = "v$CORE_VERSION"

      - run: npm run build
      - run: npm test

      - name: Publish packages
        run: |
          for PACKAGE in core ciphers modes paddings kdfs formats hashes suite; do
            PACKAGE_DIR="packages/$PACKAGE"
            PACKAGE_NAME=$(node -p "require('./$PACKAGE_DIR/package.json').name")
            PACKAGE_VERSION=$(node -p "require('./$PACKAGE_DIR/package.json').version")

            if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION already published, skip"
            else
              echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION"
              npm publish "./$PACKAGE_DIR" --access public
            fi
          done
